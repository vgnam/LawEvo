[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphlaw"
version = "0.1.0"
description = "Knowledge-guided co-evolution of robot morphologies and symbolic feedback laws"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "gymnasium[mujoco]>=1.2,<2", "mujoco>=3.3,<3.4"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
benchmarks = [
    "matplotlib>=3.8",
    "panda-gym==3.0.7",
]

[project.scripts]
morphlaw = "experiments.evolve_morphlaw:main"

[tool.setuptools.packages.find]
include = ["morphlaw*", "experiments*"]

[tool.setuptools.package-data]
morphlaw = [
    "assets/*.xml",
    "assets/assets_panda/panda_parametric.urdf",
    "assets/assets_panda/meshes/collision/*",
    "assets/assets_panda/meshes/visual/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
